name: Ingesta & Crawler Scrapio RAG

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL base a scrapear (ej. https://avafin.mx)'
        required: true
        default: 'https://avafin.mx'
      client_namespace:
        description: 'Identificador único del cliente (ej. cliente-avafin)'
        required: true
        default: 'cliente-avafin'
      max_pages:
        description: 'Límite máximo de páginas a rastrear'
        required: false
        default: '20'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Crawler e Ingesta a Pinecone
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME || 'scrapio' }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
          CLIENT_NAMESPACE: ${{ github.event.inputs.client_namespace }}
        run: npx tsx scripts/ingest.ts --maxPages ${{ github.event.inputs.max_pages }}
