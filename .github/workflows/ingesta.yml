name: Ingesta & Crawler Scrapio RAG

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL base a scrapear (ej. https://avafin.mx)'
        required: true
        default: 'https://avafin.mx'
      client_namespace:
        description: 'Identificador único del cliente (ej. cliente-avafin)'
        required: true
        default: 'cliente-avafin'
      max_pages:
        description: 'Límite máximo de páginas a rastrear'
        required: false
        default: '20'
      ai_provider:
        description: 'Proveedor de IA (gemini u openai)'
        required: false
        default: 'gemini'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias
        run: npm install

      - name: Ejecutar Crawler e Ingesta a Pinecone
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME || 'scrapio' }}
          AI_PROVIDER: ${{ github.event.inputs.ai_provider || 'gemini' }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPIO_API_URL: ${{ secrets.SCRAPIO_API_URL || 'https://scrapio-one.vercel.app' }}
        run: npx tsx scripts/ingest.ts --url "${{ github.event.inputs.target_url }}" --namespace "${{ github.event.inputs.client_namespace }}" --maxPages ${{ github.event.inputs.max_pages }} --provider "${{ github.event.inputs.ai_provider }}"
